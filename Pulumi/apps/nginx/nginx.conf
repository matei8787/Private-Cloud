events {
    worker_connections 1024;
}

http {
    # Include default mime types so files (css, js) load correctly
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimizations
    sendfile        on;
    keepalive_timeout  65;

    # --- YOUR SERVER BLOCKS ---

    server {
        listen 443 ssl;
        server_name ovpn.dorb.internal dorbjojomatei.mooo.com localhost;

        ssl_certificate /etc/pki/certs/internal_chain.pem;
        ssl_certificate_key /etc/pki/certs/internal_cert.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Static files
        location /static/ {
            alias /usr/share/nginx/html/ovpn/staticfiles/;
        }

        location /media/ {
            alias /usr/share/nginx/html/ovpn/mediafiles/;
        }

        location / {
            proxy_pass http://vpn-provisioner:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name ovpn.internal.dorb dorbjojomatei.mooo.com localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name hello.dorb.internal;

        # Static files
        location /static/ {
            alias /usr/share/nginx/html/hello/staticfiles/;
        }

        location / {
            proxy_pass http://hello:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name vault.dorb.internal; 

        # UPDATED PATH
        ssl_certificate /etc/pki/certs/internal_chain.pem;
        ssl_certificate_key /etc/pki/certs/internal_cert.key;

        location / {
            proxy_pass http://vaultwarden:80;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; 
        }
    }

    # GitLab Server Proxy
    server {
        listen 443 ssl;
        server_name gitlab.dorb.internal;

        ssl_certificate /etc/pki/certs/internal_chain.pem;
        ssl_certificate_key /etc/pki/certs/internal_cert.key;

        location / {
            proxy_pass http://10.69.10.6:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # GitLab requires high body size for large git pushes/artifacts
            client_max_body_size 0;
        }
    }

    # Optional: Runner Session Server (Port 8093)
    server {
        listen 443 ssl;
        server_name runner.dorb.internal;

        location / {
            proxy_pass http://10.69.10.7:8093;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}